groups:
  - name: heart-api
    rules:
      - alert: HeartApiDown
        expr: up{job="heart-api"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Heart API target is down"}
      - alert: HeartApiHighErrorRate
        expr: |
          sum(rate(heart_api_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(heart_api_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "More than 5% of API requests are failing"}
      - alert: HeartApiSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(heart_api_request_latency_seconds_bucket{path="/predict"}[5m]))) > 0.5
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "p95 /predict latency above 500 ms"}
      - alert: HeartApiPredictionDrift
        # share of positive predictions drifting far from the ~55% training prevalence
        expr: |
          sum(rate(heart_api_predictions_total{outcome="disease"}[30m]))
            / clamp_min(sum(rate(heart_api_predictions_total[30m])), 1e-9) > 0.85
        for: 15m
        labels: {severity: info}
        annotations: {summary: "Positive prediction rate unusually high - check for input drift"}
