# The dashboard ConfigMap (grafana-dashboards) is created from
# monitoring/grafana/dashboards/heart_api.json by scripts/deploy_k8s.sh.
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-provisioning, namespace: heart-mlops}
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - {name: Prometheus, uid: prometheus, type: prometheus, access: proxy,
         url: "http://prometheus:9090", isDefault: true}
  dashboards.yml: |
    apiVersion: 1
    providers:
      - {name: heart-mlops, folder: Heart MLOps, type: file,
         options: {path: /var/lib/grafana/dashboards}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: heart-mlops, labels: {app: grafana}}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.3.1
          env:
            - {name: GF_SECURITY_ADMIN_USER, value: admin}
            - {name: GF_SECURITY_ADMIN_PASSWORD, value: admin}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
          ports: [{containerPort: 3000}]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasource.yml
              subPath: datasource.yml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
      volumes:
        - name: provisioning
          configMap: {name: grafana-provisioning}
        - name: dashboards
          configMap: {name: grafana-dashboards}
---
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: heart-mlops}
spec:
  type: NodePort
  selector: {app: grafana}
  ports: [{port: 3000, targetPort: 3000, nodePort: 30300}]
